<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="refresh" content="1;url=https://kr.trip.com/sale/w/">
  <title>tripcom 할인 조건 페이지로 이동</title>
</head>
<body>
  <p>tripcom 할인 조건 페이지로 이동 중입니다.</p>
  <p><a href="https://kr.trip.com/sale/w/" rel="sponsored nofollow">이동하지 않으면 여기를 누르세요.</a></p>
  
  <script>
  (function(){
    var payload = {"label": "tripcom 할인 조건", "target": "https://kr.trip.com/sale/w/", "kind": "affiliate_redirect"};
    payload.path = location.pathname;
    payload.referrer = document.referrer || "";
    payload.ts = new Date().toISOString();
    var body = JSON.stringify(payload);
    try {
      if (navigator.sendBeacon) {
        navigator.sendBeacon("/api/click", new Blob([body], {type:"application/json"}));
      } else {
        fetch("/api/click", {method:"POST", headers:{"Content-Type":"application/json"}, body:body, keepalive:true});
      }
    } catch(e) {}
  })();
  </script>
  <script>setTimeout(function(){location.replace("https://kr.trip.com/sale/w/");},120);</script>
</body>
</html>
