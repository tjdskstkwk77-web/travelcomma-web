  <title>부산 호텔 페이지로 이동</title>
</head>
<body>
  <p>부산 호텔 페이지로 이동 중입니다.</p>
  <p><a href="https://www.myrealtrip.com/search?keyword=%EB%B6%80%EC%82%B0%20%ED%98%B8%ED%85%94&amp;category=hotel&amp;utm_source=mktpartner&amp;utm_medium=affiliate_cta&amp;utm_campaign=travelcomma_booking&amp;utm_content=hotel-search&amp;utm_term=%EB%B6%80%EC%82%B0%20%ED%98%B8%ED%85%94" rel="sponsored nofollow">이동하지 않으면 여기를 누르세요.</a></p>
  
  <script>
  (function(){
    var payload = {"label": "부산 호텔", "target": "https://www.myrealtrip.com/search?keyword=%EB%B6%80%EC%82%B0%20%ED%98%B8%ED%85%94&category=hotel&utm_source=mktpartner&utm_medium=affiliate_cta&utm_campaign=travelcomma_booking&utm_content=hotel-search&utm_term=%EB%B6%80%EC%82%B0%20%ED%98%B8%ED%85%94", "kind": "affiliate_redirect"};
    payload.path = location.pathname;
    payload.referrer = document.referrer || "";
    payload.ts = new Date().toISOString();
    var body = JSON.stringify(payload);
    try {
      if (navigator.sendBeacon) {
        navigator.sendBeacon("/api/click", new Blob([body], {type:"application/json"}));
      } else {
        fetch("/api/click", {method:"POST", headers:{"Content-Type":"application/json"}, body:body, keepalive:true});
      }
    } catch(e) {}
  })();
  </script>
  <script>setTimeout(function(){location.replace("https://www.myrealtrip.com/search?keyword=%EB%B6%80%EC%82%B0%20%ED%98%B8%ED%85%94&category=hotel&utm_source=mktpartner&utm_medium=affiliate_cta&utm_campaign=travelcomma_booking&utm_content=hotel-search&utm_term=%EB%B6%80%EC%82%B0%20%ED%98%B8%ED%85%94");},120);</script>
</body>
