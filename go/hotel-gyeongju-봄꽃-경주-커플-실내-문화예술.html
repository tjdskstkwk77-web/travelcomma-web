  <script>
  (function(){
    var payload = {"label": "경주 호텔", "target": "https://www.agoda.com/partners/partnersearch.aspx?pcs=1&cid=1972134&hl=ko-kr&city=17179&checkIn=2026-09-09&checkOut=2026-09-10&adults=2&rooms=1", "kind": "affiliate_redirect"};
    payload.path = location.pathname;
    payload.referrer = document.referrer || "";

    var body = JSON.stringify(payload);
    try {
      if (navigator.sendBeacon) {
        navigator.sendBeacon("/api/click", new Blob([body], {type:"application/json"}));
      } else {
        fetch("/api/click", {method:"POST", headers:{"Content-Type":"application/json"}, body:body, keepalive:true});
      }
    } catch(e) {}
  })();
  </script>
